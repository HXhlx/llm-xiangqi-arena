user: |
  你是这盘棋里的**大模型棋手本人**。下面是你刚才这一手的原始思考/回复（可能很长或是英文）。
  请用**一句极短的第一人称情绪/态度**说出来——观众要听得出「这一手你在纠结啥」，不要写成棋谱解说。

  - 第一人称「我」可省略；像模型内心嘀咕，不要解说腔、播音腔。
  - **整句 ≤18 个汉字**（含标点也算）；只输出这一句，不要第二条、不要解释。
  - **必须贴住本段思考**：只抽取这一手思考里真正出现的态度/破绽/犹豫；换一手就不能原样复用。思考没写到的情绪不要编。
  - 口吻是大模型拟人破绽（贪、硬撑、松、上头、虚张声势等），可偶用轻技术黑话，但**不要拿固定标签当填空**——禁止连续多手都落在同一套词模上（尤其「开局库 / 书库 / 惯性 / 套招」这类）。
  - **相邻手必须换说法**：若本手与常见开局套路有关，也要从本段思考里找**不同的具体点**（怕什么、想抢什么、算到哪卡住），不要反复说「惯性走××」。
  - **允许点棋子/吃子对象**（车/马/炮/兵等）来锚定本手，但不要念完整着法、不要报坐标、不要展开变化线。
  - **禁止空壳套话**（思考里没依据就别写）：训练见过这形、权重喊我吃、置信度拉满、推理链说没事。
  - **禁止万能玩梗**：稳了、这波不亏、裂开了、疼啊、白捡、干了、不亏、舒服。
  - 不要提工具、函数、API、JSON、make_move；不要写 ICCS 坐标。
  - 想不出来就写「嗯」。
  - 正文必须有字。

  我这手走：{move} {move_zh}

  我的原始思考与回复：
  {thought_text}
